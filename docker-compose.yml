# =====================================================================
# MegaSoft CRM — Stack completo (Mongo + Backend + Frontend)
# Uso:
# 1) cp backend/.env.example backend/.env  &&  editar valores
# 2) exportar la URL pública (o dejar el default):
#      export REACT_APP_BACKEND_URL="https://crm.tudominio.com"
# 3) colocar los certificados SSL del host en /opt/ssl
#      (fullchain.pem y privkey.pem)
# 4) docker compose up -d --build
# =====================================================================
version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: megasoft-crm-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [megasoft]

  backend:
    build: ./backend
    container_name: megasoft-crm-backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      - mongo
    volumes:
      # Persiste los archivos subidos (adjuntos, logos, documentos de clientes)
      - backend_uploads:/app/backend/uploads
    networks: [megasoft]
    # Descomenta para exponer el backend directamente al host (debug):
    # ports:
    #   - "8001:8001"

  frontend:
    build:
      context: ./frontend
      args:
        # ⚠️ IMPORTANTE: CRA/CRACO baja las variables en build time.
        # Aquí va la URL PÚBLICA con la que los usuarios accederán.
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-https://crm.tudominio.com}
    container_name: megasoft-crm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"    # redirige a 443
      - "443:443"  # HTTPS
    volumes:
      # Certificados del host. Deben llamarse fullchain.pem y privkey.pem
      # (o cambia los nombres en frontend/nginx-ssl.conf).
      - /opt/ssl:/etc/nginx/ssl:ro
    networks: [megasoft]

volumes:
  mongo_data:
  backend_uploads:

networks:
  megasoft:
    driver: bridge
