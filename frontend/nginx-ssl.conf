# =====================================================================
# Nginx — sirve el SPA (React build) y hace de reverse proxy de /api
# al backend (mismo esquema que el ingress de Emergent: /api -> :8001).
# Los certificados se montan desde el host en /etc/nginx/ssl
# (fullchain.pem y privkey.pem). Ver docker-compose (volume /opt/ssl).
# =====================================================================

# HTTP -> redirige a HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Subidas grandes (adjuntos, chunks de respaldo, PDFs)
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    # API + WebSocket -> backend:8001 (se preserva el prefijo /api)
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (notificaciones en tiempo real)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Operaciones largas (generación de PDFs, respaldos) y streaming
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # SPA — todo lo demás sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
